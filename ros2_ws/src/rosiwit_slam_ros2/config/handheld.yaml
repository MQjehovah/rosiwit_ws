# Handheld / backpack mapping (no wheel odometry)
#
# Frames:
#   map -> odom -> base_link -> imu_link / lidar_link
#
#   odom -> base_link : continuous LIO front-end pose (may drift)
#   map  -> odom      : loop-closure/backend anchor correction
#
# The device body (IMU) is the base_link; provide static TF
#   base_link -> imu_link / lidar_link
# from the real sensor extrinsics. No wheel odom / base_footprint is required.

global:
  slam_algorithm: fast_lio2_pipeline  # 核心算法名
  pipeline: "rosiwit_slam" # 管线名称
  pipeline_mode: mapping # 启动模式 mapping|localization|idle
  modules:
    frontend: "fast_lio2_frontend"
    backend: "ceres_pose_graph"
    loop_closure: "scan_context"
    localization: "localization_pipeline"
    map_manager: "pcd_map_manager"

  input:
    imu_topic: imu  # IMU话题
    lidar_topic: points # 雷达点云话题
    odom_topic: wheel_odom # 轮式里程计话题
    lidar_filter_num: 2 # 雷达点抽稀倍数
    lidar_min_range: 0.3 # 雷达最小有效距离(m)
    lidar_max_range: 120.0 # 雷达最大有效距离(m)
    scan_period_ms: 100.0 # 单帧扫描周期(ms)
    use_odom: false # 是否订阅并使用轮式odom
  frames:
    lidar_frame: lidar_link  # 雷达frame
    imu_frame: imu_link # IMU frame
    body_frame: base_link # 车体frame
    world_frame: map # 世界frame
    map_frame: map # 地图frame
    odom_frame: odom # 里程计frame
  map:
    resolution: 0.05  # 地图/栅格分辨率(m)
mapping:
  frontend:
    estimate_imu_lidar_extrinsic: false  # 是否在线估计雷达-IMU外参
localization: {}
ros2:
  odom_tf_publisher: none  # odom->base TF发布方式
  map_publish_period: 0.5 # 地图发布周期(s)
