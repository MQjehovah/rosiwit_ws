# ============================================================
# rosiwit_navigation 参数配置
# ============================================================
rosiwit_navigation_node:
  ros__parameters:
    # 速度限制
    max_velocity_x: 0.5
    min_velocity_x: 0.0
    max_velocity_theta: 1.0

    # 加速度限制
    max_accel_x: 0.5
    max_accel_theta: 1.0

    # 频率
    controller_frequency: 20.0
    planner_frequency: 1.0

    # 规划器 / 控制器
    planner_name: "astar"
    controller_name: "dwa"

    # 坐标系
    global_frame: "map"
    robot_frame: "base_link"

    # 导航容差
    goal_tolerance_xy: 0.1
    goal_tolerance_yaw: 0.1

    # Pure Pursuit 前瞻距离
    lookahead_distance: 0.8
    min_lookahead_distance: 0.4
    max_lookahead_distance: 1.2

    # MPPI 采样/代价参数
    mppi_horizon: 20
    mppi_samples: 160
    mppi_dt: 0.0
    mppi_lambda: 0.8
    mppi_sigma_v: 0.18
    mppi_sigma_w: 0.35
    mppi_path_weight: 2.0
    mppi_heading_weight: 0.4
    mppi_obstacle_weight: 0.03
    mppi_control_weight: 0.03
    mppi_speed_weight: 2.0
    mppi_goal_weight: 1.5
    robot_radius: 0.30
    # 规划器/控制器共用车体轮廓 (x,y,...); Hybrid A* 使用它.
    footprint: [-0.25, -0.22, 0.25, -0.22, 0.25, 0.22, -0.25, 0.22]

    # 障碍物膨胀半径（路径离障碍物的距离）
    inflation_radius: 1.0

    # 里程计话题（Gazebo 纯仿真用 /odom，跑 SLAM 时用 /lio_odom）
    odom_topic: odom

    # 动态障碍跟踪
    tracking_enabled: true
    tracking_horizon: 0.5
    tracking_cluster_distance: 0.35
    tracking_confirm_hits: 3
    tracking_max_radius: 1.2
    tracking_min_prediction_speed: 0.15
    scan_self_filter_enabled: true
    scan_self_x_min: -0.45
    scan_self_x_max: 0.75
    scan_self_y_min: -0.55
    scan_self_y_max: 0.55

    # 3D 体素 / STVL
    voxel_enabled: true
    voxel_cloud_topic: "world_cloud"
    voxel_resolution: 0.10
    voxel_min_height: -0.20
    voxel_max_height: 2.00
    voxel_decay: 2.0
