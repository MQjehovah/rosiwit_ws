# Navigation parameters tuned for frontier exploration.
# Lower speed + DWA + conservative inflation keep the robot away from walls
# while the SLAM map is still growing.
rosiwit_navigation_node:
  ros__parameters:
    # 探索巡航速度上限. MPPI 的巡航目标等于该值, 实际受
    # max_accel_x / 障碍代价 / 安全层约束.
    max_velocity_x: 1.0
    min_velocity_x: 0.0
    max_velocity_theta: 0.8

    max_accel_x: 0.4
    max_accel_theta: 0.8

    controller_frequency: 20.0
    planner_frequency: 1.0

    planner_name: "astar"
    controller_name: "mppi"
    # A* 搜索上限要覆盖整张地图; 否则不可达目标会报 iteration limit,
    # 看起来像临时失败而不是目标本身不可达.
    planner_max_iterations: 200000
    planner_timeout: 2.0

    global_frame: "odom"
    robot_frame: "base_link"
    map_frame: "odom"

    goal_tolerance_xy: 0.25
    goal_tolerance_yaw: 0.2

    lookahead_distance: 0.5
    min_lookahead_distance: 0.3
    max_lookahead_distance: 0.7

    # 车体实际半径约 0.20m; 0.24m 作为硬安全缓冲 (0.05m 地图下 5 格),
    # 0.65m 为梯度代价, 让路径走走廊中间但不会把门洞整段判死.
    # 车体实际半径约 0.20m; 硬缓冲 0.22m, 梯度膨胀 0.90m.
    # 硬缓冲过大(0.32)会堵死 0.8m 门洞; 开阔区域由梯度代价把路径推离墙.
    # robot_radius: 紫色硬边界, 规划/DWA 绝对不进入
    # inflation_radius: 紫->蓝软膨胀, 用梯度尽量规避, 窄通道允许进入
    # 车体实际半径 0.20; 硬规划边界 0.25; 0.90 为软膨胀距离
    robot_radius: 0.25
    inflation_radius: 0.90
    local_costmap_size: 10.0
    tf_stale_timeout: 0.6
    local_clear_radius: 0.20
    # 平滑器会把 unknown 当自由并可能把路径拉进未知墙; 探索时关闭
    enable_path_smoothing: true

    # DWA 卡死恢复
    recovery_enabled: true
    recovery_trigger_cycles: 40
    recovery_duration: 1.2
    # 后退 + 旋转才能从贴墙/家具卡死中脱出; 纯原地旋转会被物理卡住
    recovery_linear_velocity: -0.12
    recovery_angular_velocity: 0.60
    recovery_bypass_safety: true

    # ---- LiDAR safety layer (Nav2 Collision Monitor style) ----
    safety_enabled: true
    safety_pointcloud_topic: /velodyne_points
    safety_base_frame: base_footprint
    safety_source_timeout: 1.0
    safety_self_filter_radius: 0.20
    safety_fail_safe_on_timeout: true
    safety_min_height: 0.05
    safety_max_height: 1.0
    # 边界: 碰撞半径 0.20m; 安全停止半径 0.25m; 规划硬边界 0.25m;
    # 0.90m 是软膨胀距离. 规划不允许路径进入 0.25m, 安全层进入 0.25m 就 STOP.
    safety_stop_enabled: true
    safety_stop_radius: 0.25
    safety_stop_polygon: [-0.25, -0.25, 0.25, -0.25, 0.25, 0.25, -0.25, 0.25]
    safety_stop_max_points: 2
    # SLOWDOWN 也关闭, 避免和 DWA 速度控制叠加
    safety_slowdown_enabled: false
    safety_slowdown_polygon: [-0.60, -0.50, 0.70, -0.50, 0.70, 0.50, -0.60, 0.50]
    safety_slowdown_max_points: 2
    safety_slowdown_ratio: 0.5
    safety_approach_enabled: false
    safety_time_before_collision: 1.0
    safety_simulation_time_step: 0.1
    safety_footprint: [-0.25, -0.22, 0.25, -0.22, 0.25, 0.22, -0.25, 0.22]

    odom_topic: /odom
