# Navigation parameters tuned for frontier exploration.
# Lower speed + DWA + conservative inflation keep the robot away from walls
# while the SLAM map is still growing.
rosiwit_navigation_node:
  ros__parameters:
    max_velocity_x: 0.35
    min_velocity_x: 0.0
    max_velocity_theta: 0.8

    max_accel_x: 0.4
    max_accel_theta: 0.8

    controller_frequency: 20.0
    planner_frequency: 1.0

    planner_name: "astar"
    controller_name: "dwa"

    global_frame: "odom"
    robot_frame: "base_link"

    goal_tolerance_xy: 0.25
    goal_tolerance_yaw: 0.2

    lookahead_distance: 0.5
    min_lookahead_distance: 0.3
    max_lookahead_distance: 0.7

    # 车体实际半径约 0.20m; 0.24m 作为硬安全缓冲 (0.05m 地图下 5 格),
    # 0.65m 为梯度代价, 让路径走走廊中间但不会把门洞整段判死.
    # 车体实际半径约 0.20m; 硬缓冲 0.22m, 梯度膨胀 0.90m.
    # 硬缓冲过大(0.32)会堵死 0.8m 门洞; 开阔区域由梯度代价把路径推离墙.
    robot_radius: 0.22
    inflation_radius: 0.90
    local_costmap_size: 10.0
    # 平滑器会把 unknown 当自由并可能把路径拉进未知墙; 探索时关闭
    enable_path_smoothing: false

    # ---- LiDAR safety layer (Nav2 Collision Monitor style) ----
    safety_enabled: true
    safety_pointcloud_topic: /velodyne_points
    safety_base_frame: base_footprint
    safety_source_timeout: 2.0
    safety_fail_safe_on_timeout: false
    safety_min_height: 0.05
    safety_max_height: 1.0
    safety_stop_polygon: [-0.26, -0.22, 0.26, -0.22, 0.26, 0.22, -0.26, 0.22]
    safety_stop_max_points: 2
    safety_slowdown_polygon: [-0.60, -0.50, 0.70, -0.50, 0.70, 0.50, -0.60, 0.50]
    safety_slowdown_max_points: 2
    safety_slowdown_ratio: 0.5
    safety_approach_enabled: true
    safety_time_before_collision: 2.0
    safety_simulation_time_step: 0.1
    safety_footprint: [-0.25, -0.22, 0.25, -0.22, 0.25, 0.22, -0.25, 0.22]

    odom_topic: /odom
