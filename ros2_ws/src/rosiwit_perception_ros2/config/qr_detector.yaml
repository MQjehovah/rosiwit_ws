qr_detector:
  ros__parameters:
    # 输入：默认前视相机；换成 USB 相机可改为 /camera/image_raw
    image_topic: /camera_front/camera/image_raw
    camera_info_topic: /camera_front/camera/camera_info

    # 输出
    detections_topic: /qr/detections       # std_msgs/String (JSON)
    codes_topic: /qr/codes                 # rosiwit_perception_msgs/QrCodeArray
    debug_image_topic: /qr/debug_image     # sensor_msgs/Image

    # 二维码物理边长（米），用于 solvePnP；<= 0 则关闭 3D 位姿
    qr_size: 0.10

    # 过滤/限频
    min_size_px: 24.0
    max_rate_hz: 10.0

    # 多帧确认：连续命中 confirm_hits 次才输出
    confirm_hits: 2
    confirm_max_age: 0.5

    # TF：把相机系位姿变换到 map；TF 缺失时自动退回相机系
    target_frame: map
    use_tf: true
    tf_timeout: 0.05

    # 视觉伺服靠近
    action_name: /qr/approach
    cmd_vel_topic: /cmd_vel
    approach_max_linear: 0.15
    approach_max_angular: 0.5
    approach_distance_tol: 0.03
    approach_bearing_tol: 0.03
    approach_loss_timeout: 0.8

    publish_empty: false
    publish_debug_image: true
