syntax = "proto3";

package debug_bridge;

// debug_hmi <-> debug_bridge 的唯一数据通道。
// 机器人侧手工编码（Melodic/Python2 没有 protobuf runtime），
// 浏览器侧用 protobufjs + 生成的 JSON descriptor 解码。

enum Compression {
  NONE = 0;
  ZLIB = 1;
}

message Header {
  string frame_id = 1;
  double stamp = 2;
}

message Pose2D {
  double x = 1;
  double y = 2;
  float theta = 3;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Transform {
  string parent = 1;
  string child = 2;
  Vector3 translation = 3;
  Quaternion rotation = 4;
  double stamp = 5;
}

message TfUpdate {
  repeated Transform transforms = 1;
  bool is_static = 2;
}

message SlamInfo {
  int32 slam_state = 1;
  int32 location_status = 2;
  float matching_degree = 3;
  int32 update_request = 4;
  string map_name = 5;
  double map_area = 6;
  Pose2D robot_pose = 7;
  double stamp = 8;
}

message LogEntry {
  int32 level = 1;
  string name = 2;
  string msg = 3;
  double stamp = 4;
}

message PoseStamped {
  Pose2D pose = 1;
  double z = 2;
}

message PathFrame {
  Header header = 1;
  repeated PoseStamped poses = 2;
  uint32 seq = 3;
  string stream = 4; // global_path / local_path
}

message LaserFrame {
  Header header = 1;
  float angle_min = 2;
  float angle_max = 3;
  float angle_increment = 4;
  float range_min = 5;
  float range_max = 6;
  bytes ranges = 7; // float32 LE
  string stream = 8; // ROS topic
}

message PolygonFrame {
  Header header = 1;
  bytes xy = 2; // float32 pairs
  string stream = 3; // ROS topic
}

message TopicInfo {
  string name = 1;
  string type = 2;
}

message TopicList {
  repeated TopicInfo topics = 1;
}

message TopicStat {
  string topic = 1;
  uint32 count = 2;
  uint64 age_ms = 3;
  uint32 bytes = 4;
  uint64 total_bytes = 5;
  float rate_hz = 6;
}

message RawMessage {
  string topic = 1;
  string type = 2;
  string json = 3;
  double stamp = 4;
}

message ServiceResult {
  string request_id = 1;
  string service = 2;
  bool ok = 3;
  string json = 4;
}

message GridFrame {
  Header header = 1;
  uint32 width = 2;
  uint32 height = 3;
  float resolution = 4;
  Pose2D origin = 5;
  Compression compression = 6;
  bytes data = 7; // zlib(int8[width*height]) when compression=ZLIB
  uint32 seq = 8;
  string stream = 9; // ROS topic
}

message CloudFrame {
  Header header = 1;
  uint32 count = 2;
  float voxel = 3;
  Compression compression = 4;
  bytes xyz_cm = 5; // int16 LE [count*3], centimeters, zlib when ZLIB
  uint32 seq = 6;
  string stream = 7;
}

message StreamInfo {
  string name = 1;
  bool available = 2;
  float rate_hz = 3;
}

message ServerHello {
  string name = 1;
  string version = 2;
  repeated StreamInfo streams = 3;
}

message Status {
  string stream = 1;
  bool ok = 2;
  string message = 3;
  uint64 stamp_ms = 4;
}

message Error {
  string message = 1;
}

message ClientCommand {
  enum Action {
    SUBSCRIBE = 0;
    UNSUBSCRIBE = 1;
    REQUEST = 2;
    SET_INITIAL_POSE = 3;
    CALL_SERVICE = 4;
    GET_TOPICS = 5;
    RAW_SUBSCRIBE = 6;
    RAW_UNSUBSCRIBE = 7;
  }
  Action action = 1;
  string stream = 2;
  float rate_hz = 3;
  float voxel = 4;
  uint32 max_points = 5;
  bool refresh = 6;
  double x = 7;
  double y = 8;
  double yaw = 9;
  string service = 10;
  string args_json = 11;
  string request_id = 12;
  string topic = 13;
  string type = 14;
}

message Envelope {
  oneof payload {
    ServerHello hello = 1;
    GridFrame grid = 2;
    CloudFrame cloud = 3;
    Status status = 4;
    Error error = 5;
    TfUpdate tf = 6;
    SlamInfo slam = 7;
    LogEntry log = 8;
    PathFrame path = 9;
    LaserFrame laser = 10;
    PolygonFrame polygon = 11;
    TopicList topics = 12;
    TopicStat stat = 13;
    RawMessage raw = 14;
    ServiceResult service = 15;
  }
}
