# 反光板绝对定位 / 自动标定 (T1) —— reflector_absolute_node.py 参数
#
# 两种用法:
#   1) 标定 (第一次, 定位正常的情况下):
#        roslaunch rosiwit_slam_ros1 reflector_calib.launch
#      正常开车走一圈, 日志 [reflector_calib] 会输出稳定簇;
#      Ctrl-C 后结果写到 ~/.ros/reflector_calib.yaml —— 复制 reflectors 到本文件。
#   2) 定位 (标定完成后):
#      roslaunch rosiwit_slam_ros1 reflector.launch
#      或 rosiwit_slam.launch start_reflector:=true
#
# 说明: 点云是 lidar 系 (安装 pitch 39.37°), 节点用 lidar_in_base 外参 +
#       curr_localization_pose 把它转到 map 系; 匹配得到的 C 是绝对修正。

mode: locate                     # locate | calibrate
cloud_topic: /vanjee_points722   # 3D 点云 (必须带 intensity)
pose_topic: /curr_localization_pose  # map 系 base_footprint 位姿 (定位节点发布)
frame: map                       # 发布位姿的参考系
absolute_topic: /absolute_pose   # 与 localization.absolute.topic 一致

intensity_min: 100.0             # 反光板强度阈值 (现场按实测调; 普通表面通常 < 60)
cluster_link_dist: 0.20          # 3D 邻接聚类连接距离 (m)
cluster_min_pts: 3               # 一个簇最少点数 (去噪)
cluster_max_pts: 300             # 一个簇最多点数 (排除大片高反光地面)
min_reflectors: 2                # 至少匹配到几块板才发布
residual_max: 0.20               # 配准残差门限 (m), 超过丢弃
cov_xy: 0.05                     # 发布协方差 xy (m^2)
cov_yaw: 0.03                    # 发布协方差 yaw (rad^2)
pose_timeout: 1.0                # 位姿超过该时间(s)未更新就不处理

# lidar -> base_footprint 静态外参 (URDF: base_link->lidar xyz .4145/.0193/.9144,
# rpy 39.37/1.13/89.9, base_footprint->base_link z=0.07, 已合并到 z)
lidar_in_base: {x: 0.4145, y: 0.0193, z: 0.9844, roll: 39.37, pitch: 1.13, yaw: 89.9}

# ---- 标定参数 (mode=calibrate 时生效) ----
calib_cluster_dist: 0.5          # map 系聚类半径 (m): 同一个反光板的多帧观测归并
calib_min_obs: 20                # 至少被独立观测多少次才算稳定 (每簇 0.3s 记一次)
calib_max_std: 0.15              # 位置标准差上限 (m)
calib_min_interval: 0.3          # 同一簇最小观测间隔 (s)
calib_report_sec: 5.0            # 日志输出周期 (s)
output_yaml: ~/.ros/reflector_calib.yaml

# 反光板地图坐标 (map 系) —— 标定结果复制到这里, 例如:
# reflectors:
#   - {x: 12.34, y: -5.67}   # obs=57
#   - {x: 30.10, y: 8.02}    # obs=41
reflectors: []
