# 反光板绝对定位 (T1) —— reflector_absolute_node.py 参数
# 现场标定步骤:
#   1. 用建图/定位时的地图坐标, 找到每块反光板中心的 (x, y)（map 系, 米）
#   2. 填进下面 reflectors 列表, 重新 launch reflector.launch
#   3. 观察日志 [reflector] 与 /absolute_pose; residual 应 < residual_max
# 未标定 (reflectors 为空) 时节点只做检测, 不发布 —— 安全。

cloud_topic: /vanjee_points722   # 3D 点云 (必须带 intensity)
frame: map                       # 发布位姿的参考系
intensity_min: 100.0             # 反光板强度阈值 (现场按实测调; 普通表面通常 < 60)
cluster_link_dist: 0.20          # 2D 邻接聚类连接距离 (m)
cluster_min_pts: 3               # 一个簇最少点数 (去噪)
cluster_max_pts: 300             # 一个簇最多点数 (排除大片高反光地面)
min_reflectors: 2                # 至少匹配到几块板才发布
residual_max: 0.20               # 配准残差门限 (m), 超过丢弃
cov_xy: 0.05                     # 发布协方差 xy (m^2)
cov_yaw: 0.03                    # 发布协方差 yaw (rad^2)
absolute_topic: /absolute_pose   # 与 localization.absolute.topic 一致

# 反光板地图坐标 (map 系) —— 现场标定后填写, 例如:
# reflectors:
#   - {x: 12.34, y: -5.67}
#   - {x: 30.10, y: 8.02}
reflectors: []
