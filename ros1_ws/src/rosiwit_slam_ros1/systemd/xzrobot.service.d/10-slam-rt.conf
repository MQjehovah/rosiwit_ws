# SLAM 跟踪线程实时优先级 (2026-11-27)
#
# ★状态: 暂不安装 (2026-11-27 22:05 已从设备撤回)。当晚一次带 RT 的诊断回放期间整机硬重启, 原因未完全查明;
#   恢复前先按 docs/HANDOVER_2026-11-27.md §3 P1 验证 (回放优先级用 40, 不用 50)。
#
# SLAM 节点启动后自己把跟踪线程 (线程名 slam_loc) 设成 SCHED_FIFO 40:
#   src/rosiwit_slam/src/slam_core/slam_pipeline.cpp  SlamPipeline::localizationWorker
# 非特权进程要把实时优先级设到 N, 需要 RLIMIT_RTPRIO >= N; 系统默认是 0, 所以这段代码之前一直
# 静默不生效 (现在节点启动时会打一行 "tracking thread scheduling", 以它为准)。
# 这里只放开到代码用到的 40, 不多给。
#
# 跟踪线程绝大多数时间阻塞着等雷达帧, SCHED_FIFO 只决定"它就绪时先上 CPU", 不会空转。
# 内核另有 sched_rt_runtime_us=950000 (默认): 实时线程每秒最多占一个核 950ms, 超了会被内核按住到
# 下一秒 —— 这是整机其余任务的保底, 本文件不改它。
[Service]
LimitRTPRIO=40
