# ============================================================================
# movebase_compat.yaml — 用 rosiwit_navigation_ros1 顶替 robot_movebase 时的参数
#
# ⚠ 本文件是「实车参数」，不是仿真/源码默认值。
#   数据来源: 192.168.21.166 上正在运行的 /robot_move_base/* (2026-10-21 读取),
#   与 robot_movebase 源码里的 config/robot_movebase_v1.yaml **不同**。
#
#   实车 footprint (base_footprint):
#       [-0.25,-0.33] [0.45,-0.33] [0.55,-0.20]
#       [ 0.55, 0.20] [0.45, 0.33] [-0.25, 0.33]
#   实车规划安全距离: g_min_safe=0.39, g_max_safe=0.42
#     旧节点: CostMapInflate(map, 0.1) 后再 RobotNaviMakePlan(..., g_max_safe),
#     每次膨胀还会加 1 个 cell (0.05), 失败才降到 g_min_safe。等效半径:
#       max: 0.10 + 0.42 + 2*0.05 = 0.62
#       min: 0.10 + 0.39 + 2*0.05 = 0.59
#   → 本包单次规划: robot_radius=0.39 (硬禁区=旧 min) /
#     inflation_radius=0.62 (软代价上限=旧 max), 用一份代价图同时表达两档。
#
#   其余对齐: max_speed=0.8, speed_lim_w=0.5, accel_lim_v_x=0.3, accel_lim_w=0.2,
#             min/max_lookahead_dist=0.3/0.9, xy/yaw_goal_tolerance=0.1,
#             g_control_freq=10, global_frame=map, robot_base_frame=base_footprint。
#
#   控制器: 实车 2026-10-21 起用 MPPI + footprint-aware (A/B 推荐).
#   回退: controller_name: "dwa" + footprint_aware_control: false。
#   报告: docs/superpowers/specs/2026-10-21-controller-footprint-ab-report.md
# ============================================================================

# ---- robot_movebase 接口 ----
movebase_compat_enabled: true
cmd_vel_topic: "/cmd_vel"
movebase_cmd_vel_topic: "/movebase_cmd_vel"
# 实车 footprint 展平 (x,y,...)
movebase_robot_footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]
movebase_default_speed: 0.8
movebase_back_speed: 0.1
movebase_rotate_speed: 0.5
movebase_stuck_timeout: 60.0
movebase_goal_yaw_tolerance: 0.1
movebase_rotate_tolerance: 0.05
movebase_prediction_horizon: 1.0

# ---- 频率 ----
controller_frequency: 10.0
planner_frequency: 1.0

# ---- 速度 / 加速度 (实车) ----
max_velocity_x: 0.8
min_velocity_x: 0.0
max_velocity_theta: 0.5
max_accel_x: 0.3
max_accel_theta: 0.4   # A/B 推荐 0.4; 实车 accel_lim_w=0.2/max_w_inc=0.3, 现场确认

# ---- 规划器 / 控制器 ----
planner_name: "astar"
controller_name: "mppi"
planner_max_iterations: 200000
planner_timeout: 2.0

# ---- 坐标系 ----
global_frame: "map"
robot_frame: "base_footprint"
map_frame: "map"
odom_topic: "/odom"
# RViz "2D Nav Goal" 默认话题; 订阅后按 goal 的箭头方向对齐末端航向
rviz_goal_topic: "/move_base_simple/goal"
rviz_goal_align_yaw: true

# ---- 容差 / 前瞻 (实车 0.3~0.9) ----
goal_tolerance_xy: 0.1
goal_tolerance_yaw: 0.1
lookahead_distance: 0.6
min_lookahead_distance: 0.3
max_lookahead_distance: 0.9

# ---- 规划安全距离 (实车 g_min_safe=0.39 / g_max_safe 等效 0.62) ----
robot_radius: 0.39
# 长方形车体: 控制器按 footprint 采样点查 raw costmap, 而不是只看中心点.
# 实车已开启 (A/B: MPPI+footprint 零碰撞). 回退时改 false + controller_name: dwa.
# 报告: docs/superpowers/specs/2026-10-21-controller-footprint-ab-report.md
footprint_aware_control: true
footprint_sample_spacing: 0.05
inflation_radius: 0.62

# ---- 安全层 (实车 footprint + stop_dist=0.12 / g_robot_safe_dist=0.3) ----
safety_enabled: true
safety_self_filter_radius: 0.25
safety_fail_safe_on_timeout: true
safety_source_timeout: 0.5
# 实车 footprint 外扩 0.12m
safety_stop_polygon: [-0.37, -0.45, 0.67, -0.45, 0.67, 0.45, -0.37, 0.45]
# 实车 footprint 外扩 0.30m
safety_slowdown_polygon: [-0.55, -0.63, 0.85, -0.63, 0.85, 0.63, -0.55, 0.63]
safety_slowdown_ratio: 0.5
safety_approach_enabled: true
safety_time_before_collision: 2.0
# 实车 footprint
safety_footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]

# ---- 动态障碍 ----
tracking_enabled: true
tracking_horizon: 0.5
tracking_cluster_distance: 0.35
tracking_confirm_hits: 3

# ---- 3D 体素 ----
voxel_enabled: true
voxel_cloud_topic: "/world_cloud"
voxel_resolution: 0.10
voxel_min_height: -0.20
voxel_max_height: 2.00
voxel_decay: 2.0
voxel_inflation: 0.15

# ---- 动态覆盖清洁 (navi_cmd=20) ----
coverage_controller_name: "pure_pursuit"  # 覆盖模式单独控制器
coverage_sweep_width: 0.5          # 清扫宽度 m
coverage_max_speed: 0.4            # robot_vel<=0 时的覆盖速度 m/s
coverage_resolution: 0.05          # 与地图分辨率一致最好
coverage_replan_period: 10.0       # 周期兜底；正常按“路径走完/2s 不动”重规划
coverage_horizon: 2.5              # 每段执行长度 m
coverage_retry_timeout: 10.0       # 被动态障碍挡住多久后标不可达
coverage_complete_rate: 0.995      # 覆盖率达到多少就收尾, 剩余标不可达
coverage_blocked_inflation: 0.10   # 动态障碍点膨胀 m
coverage_plan_inflation: 0.0       # 覆盖 A* 不再膨胀：区域边界=硬边界, 车体形状交给 footprint
coverage_plan_robot_radius: 0.0
coverage_report_path: ""           # 非空则结束写 coverage_report.json
