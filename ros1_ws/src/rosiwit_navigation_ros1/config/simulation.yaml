# ============================================================
# rosiwit_navigation_ros1 仿真参数 (Gazebo + rosiwit_slam_ros1)
#
# 与 default.yaml / movebase_compat.yaml (实车) 分开, 避免仿真调参污染实车。
# 仿真环境事实:
#   * 车体: gt 实机模型 (模型 x -0.327..0.565, y +-0.359), 轮半径 0.0708, 轮距 0.467
#   * 传感器: VLP-16 (/velodyne_points) + IMU (/imu), 没有 2D /scan
#   * 定位: rosiwit_slam_ros1 的 /lio_odom (pose 已在 map 系) + dynamic map->odom
#   * 障碍: SLAM 的 /world_cloud (world 系点云) -> 体素层, 不再依赖 /scan
# 由 launch/navigation_simulation.launch 以私有命名空间加载。
# ============================================================

# ---------- 速度 / 加速度 (实车 default.yaml max_velocity_x=0.8) ----------
max_velocity_x: 0.8
min_velocity_x: 0.0
max_velocity_theta: 0.8

max_accel_x: 0.8
max_accel_theta: 0.6

# ---------- MPPI 采样/代价参数 ----------
mppi_horizon: 20
mppi_samples: 160
mppi_dt: 0.0
mppi_lambda: 0.8
mppi_sigma_v: 0.18
mppi_sigma_w: 0.35
mppi_path_weight: 2.0
mppi_heading_weight: 0.4
mppi_obstacle_weight: 0.03
mppi_control_weight: 0.03
mppi_speed_weight: 2.0
mppi_goal_weight: 1.5

# ---------- 规划器 ----------
# 运动 profile 决定倒车策略:
#   clean: 后置清洁组件, 只允许前进 (倒车只在 recovery); 规划器=clean_planner
#   free : 自由导航, 允许前进/倒车灵活走位; 规划器=free_planner (Hybrid A*)
# 运行时切换: rostopic pub /set_motion_profile std_msgs/String "data: 'free,mppi'"
motion_profile: "clean"
clean_planner: "hybrid_astar"   # 清洁也用 Hybrid A*, 但 allow_reverse=false (只能原地转)
free_planner: "hybrid_astar"
# 初始规划器 (启动后按 motion_profile 覆盖)
planner_name: "hybrid_astar"
planner_max_iterations: 300000
planner_timeout: 6.0
planner_allow_reverse: true
planner_max_reverse_distance: 1.0

# ---------- 频率 ----------
controller_frequency: 10.0
planner_frequency: 1.0
# 局部代价地图更新频率: 提到实车 default.yaml 的 5.0 (2Hz 时 MPPI 的障碍
# 最多滞后 0.5s, 0.4m/s 下就是 0.2m, 贴障碍表现为一顿一顿); scan 点标记
# 已栅格化, 5Hz 负担得起.
costmap_update_rate: 5.0
# spinner 线程数 (代价地图与控制环并行)
spinner_threads: 2

# ---- 重规划策略 ----
# Hybrid A* 每次重规划可能给出不同的首段机动 (前进/倒车), 控制器跟着翻转 ->
# 原地抖. 只在新目标/规划失败时重规划; blocked 不触发, 阻塞由 recovery 接管.
replan_max_interval: 20.0
replan_min_interval: 4.0
replan_on_blocked: false

# ---------- 控制器 ----------
# MPPI + footprint 感知 (A/B 报告推荐组合; DWA+footprint 会绕圈)
controller_name: "mppi"
coverage_controller_name: "pure_pursuit"   # 行段是长直线; 实测 rpp 在覆盖行段会原地打转

# ---------- 坐标系 ----------
global_frame: "map"
robot_frame: "base_footprint"
map_frame: "map"

# ---------- 导航容差 ----------
# 仿真端 Hybrid A* 末段收敛在 0.18~0.19m 附近 (0.05m 栅格 + 安全层减速),
# 容差给 0.20; 实车默认 0.10 不动.
goal_tolerance_xy: 0.20
goal_tolerance_yaw: 0.20

# ---------- 前瞻 ----------
lookahead_distance: 0.5
min_lookahead_distance: 0.25
max_lookahead_distance: 0.7

# ---------- 车体 / 规划安全距离 ----------
# 与实车 default.yaml 一致: footprint x -0.25..0.55, y +-0.33 (前部斜切).
# gt.dae 实测车体 x -0.327..0.565, y +-0.359, 模型已前移 0.119 对齐驱动轮轴,
# 车头 0.565 与前声呐 0.5498 对齐; 导航用实车标定过的 footprint.
robot_radius: 0.39
footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]
# 轮廓内缩(负余量): 碰撞检查时允许贴边 2cm. 配合 0.05m 栅格, 0.75m 车身
# 可过 ~0.85m 的地图空白通道; 安全层(2D 停障多边形)仍按实际车体兜底.
footprint_shrink: 0.02
footprint_aware_control: true
footprint_sample_spacing: 0.05
path_resample_step: 0.08
# g_max_safe 的等效膨胀半径 (实车 0.62)
inflation_radius: 0.62

# ---------- 话题 ----------
# 用 SLAM 的 /lio_odom 而不是 Gazebo 的 /odom: nav 直接把 odom.pose 当作
# 当前位姿使用, /odom 在 odom 系会漂, /lio_odom 已在 map 系。
odom_topic: /lio_odom
map_topic: /map
scan_topic: /scan
# 实机有 2D 雷达 (Vanjee 716N -> /scan, frame laser), 仿真同样发布 /scan
require_scan: true
rviz_goal_topic: "/move_base_simple/goal"
rviz_goal_align_yaw: true

# ---------- 3D 体素 / STVL 层 (仿真里的障碍来源) ----------
voxel_enabled: true
voxel_cloud_topic: "/world_cloud"
voxel_resolution: 0.10
voxel_max_points: 200000
voxel_min_height: 0.15
voxel_max_height: 1.60
voxel_decay: 2.0
voxel_inflation: 0.05
# /world_cloud 是 SLAM 输出的实时点云, 断流说明前端/定位异常, 应当停车
require_cloud: true
cloud_timeout: 1.5

# ---------- 安全层 ----------
# /scan 点是安全层唯一输入 (applySafety -> laser_points_); 仿真 2D 雷达接入后
# 与实机一致地启用, 停障/减速多边形直接沿用实车 default.yaml.
safety_enabled: true
safety_self_filter_radius: 0.10
scan_self_filter_enabled: true
scan_self_x_min: -0.45
scan_self_x_max: 0.75
scan_self_y_min: -0.55
scan_self_y_max: 0.55
safety_fail_safe_on_timeout: true
safety_source_timeout: 0.5
# ---- 安全区 (nav2_collision_monitor 机制) ----
# 车身内的点由 body_polygon 排除 (footprint 包围盒 + safety_body_margin),
# 所以下面三个 STOP 区都从车体边缘之外开始. 以前用 "包围盒内不判定 + 大矩形自过滤"
# 的组合, 结果 safety_stop_polygon 整个落在自过滤框里, STOP 永远进不去.
safety_body_margin: 0.05
# 前进: 车头前 0 ~ 0.4m
safety_stop_polygon: [0.55, -0.40, 0.95, -0.40, 0.95, 0.40, 0.55, 0.40]
# 后退: 车尾后 0.35 ~ 0.75m
safety_stop_polygon_backward: [-0.75, -0.40, -0.35, -0.40, -0.35, 0.40, -0.75, 0.40]
# 原地旋转: 车体扫掠面 + 0.2m
# 原地转用扫掠圆 (半径 = 车体最远顶点 0.64 + 余量); 0 = 用上面的矩形
safety_rotation_radius_margin: 0.10
safety_stop_polygon_rotation: [-0.50, -0.55, 0.80, -0.55, 0.80, 0.55, -0.50, 0.55]
# 减速: 车头前 0 ~ 0.6m
safety_slowdown_polygon: [0.55, -0.55, 1.15, -0.55, 1.15, 0.55, 0.55, 0.55]
# 滞回 (20Hz 下 2/3 帧 = 100/150ms)
safety_stop_trigger_frames: 2
# 点数阈值: 0.8m 处 10cm 障碍约 20 个点, 稀疏伪回波只有 3~4 个
safety_stop_max_points: 4
safety_slowdown_max_points: 6
safety_stop_release_frames: 3
safety_slowdown_trigger_frames: 1
safety_slowdown_release_frames: 2

# ---- 指令整形 / 死手 / 遥控仲裁 (nav2 velocity_smoother + twist_mux) ----
velocity_timeout: 0.6          # 无指令超时后平滑回零 (0=关闭)
deadband_velocity_v: 0.0
deadband_velocity_w: 0.0
teleop_topic: ""               # 例如 /cmd_vel_teleop; 空=关闭
teleop_timeout: 0.5
strict_config: false           # true: 配置自检失败直接退出
safety_approach_enabled: true
safety_time_before_collision: 2.0
# 车体外轮廓 (与实车 safety_footprint 相同), movebase 兼容层的 /robot_footprint 用它
safety_footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]

# ---------- 动态障碍跟踪 ----------
# 跟踪聚类吃 /scan 点 (tracker_points_ 来自 laser_points_); 仿真是静态场景, 保持关闭
tracking_enabled: false
tracking_horizon: 0.5
tracking_cluster_distance: 0.35
tracking_confirm_hits: 3
tracking_max_radius: 1.2
tracking_min_prediction_speed: 0.15

# ---------- 统一恢复: 后退 -> 原地转向 -> 重试原任务 ----------
recovery_enabled: true
recovery_max_attempts: 2
recovery_back_distance: 0.40
recovery_timeout: 8.0
# 运动看门狗: 指令有效但底盘不动 / 安全层持续停住 -> 立即恢复 (不再等 60s)
nav_no_progress_timeout: 8.0
nav_safety_stop_timeout: 2.0
movebase_stuck_timeout: 10.0
# 定位健康 (/slam/info): LOST 立即停车; matching 低于阈值时限速
slam_info_timeout: 2.0
slam_degrade_matching: 0.65
slam_degrade_scale: 0.5

# ---- 分层代价地图 (B) ----
# 禁行区: 订阅 xzrobot_ros_dependency/VirtualObstacles (每个 form 是一个多边形),
# 同时进入规划视图与控制视图, 立即触发重规划.
keepout_enabled: true
virtual_obstacles_topic: "/virtual_obstacles"
keepout_frame: "map"
# 分区限速 (静态配置; 运行时可用 /speed_limit_zones 覆盖, 格式 "x,y,w,h,v;...").
speed_limit_zones: []

# ---- 动态覆盖清洁 (navi_cmd=20) ----
coverage_sweep_width: 0.5
coverage_max_speed: 0.25
coverage_resolution: 0.05
coverage_replan_period: 10.0
coverage_horizon: 6.0
coverage_retry_timeout: 10.0
coverage_complete_rate: 0.995
coverage_blocked_inflation: 0.10
coverage_plan_inflation: 0.0
coverage_plan_robot_radius: 0.0
# 行间掉头: 0 = 原地转 90+横移+90; 0.25 = 半圆弧 (R = 行距/2, 行端需有 R 转弯余量)
coverage_turn_radius: 0.0
# headland 环: 0 = 不做 (行线本身贴到区域边界); = sweep 时先绕边界一圈
coverage_headland_width: 0.0
# 门洞切分阈值 (0=关). 实测无收益, 整屋覆盖如出现跨房间来回跑再开 0.72
coverage_doorway_width: 0.0
coverage_report_path: ""
