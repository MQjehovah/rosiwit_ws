# ============================================================
# rosiwit_navigation_ros1 默认参数
#
# ⚠ 车体/安全参数取自实车 192.168.21.166 的 /robot_move_base/*，
#   不是仿真值。robot_movebase 兼容接口请用 config/movebase_compat.yaml。
# 速度/加速度/容差/前瞻/安全距离的实车依据见
# docs/superpowers/specs/2026-10-21-ros1-movebase-interface-compat-design.md §9。
# ============================================================
# 速度限制 (实车 max_speed=0.8, speed_lim_w=0.5)
max_velocity_x: 0.8
min_velocity_x: 0.0
max_velocity_theta: 0.5

max_accel_x: 0.3
max_accel_theta: 0.2

# MPPI 采样/代价参数
mppi_horizon: 20
mppi_samples: 160
mppi_dt: 0.0
mppi_lambda: 0.8
mppi_sigma_v: 0.18
mppi_sigma_w: 0.35
mppi_path_weight: 2.0
mppi_heading_weight: 0.4
mppi_obstacle_weight: 0.03
mppi_control_weight: 0.03
mppi_speed_weight: 2.0
mppi_goal_weight: 1.5

# 加权 A* 倍率: 膨胀代价大时防搜索退化 (窄通道实测 12.8s->3.4s)
planner_heuristic_weight: 2.0
planner_max_iterations: 200000
planner_timeout: 1.0   # hybrid 主规划 1s 预算, 超时立刻回落 A* (窄门洞)
planner_allow_reverse: true
planner_max_reverse_distance: 1.0

# 频率 (实车 g_control_freq=10)
controller_frequency: 10.0
planner_frequency: 1.0

# 规划器 / 控制器
planner_name: "astar"
controller_name: "dwa"
# 运动 profile: clean=只前进 (倒车仅在恢复), free=允许倒车.
# 注意: 这两个 planner 名必须写, 否则会退回代码默认 (clean_planner=astar),
# 真机会静默从 hybrid_astar 变成 A*.
motion_profile: "clean"
clean_planner: "hybrid_astar"
free_planner: "hybrid_astar"

# 坐标系 (实车 robot_base_frame=base_footprint)
global_frame: "map"
robot_frame: "base_footprint"
map_frame: "map"

# 导航容差 (实车 xy/yaw_goal_tolerance=0.1)
goal_tolerance_xy: 0.1
goal_tolerance_yaw: 0.1

# 前瞻距离 (实车 min/max_lookahead_dist=0.3/0.9)
lookahead_distance: 0.6
min_lookahead_distance: 0.3
max_lookahead_distance: 0.9

# 规划安全距离 (m)
# robot_radius = 实车 g_min_safe (硬禁区); inflation_radius = g_max_safe 的等效膨胀.
# 实车 footprint x[-0.25,0.55] y[-0.33,0.33] 由 safety_footprint 表达.
robot_radius: 0.33
# 规划器/控制器共用车体轮廓; Hybrid A* 使用它, A* 只使用 robot_radius.
footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]
# 长方形车体: 控制器按 footprint 采样点查 raw costmap, 而不是只看中心点.
# 默认关闭: A/B 实测 DWA+footprint 会绕圈, 建议按下面组合验证后再打开:
#   controller_name: mppi
#   footprint_aware_control: true
#   max_accel_theta: 0.3
# 报告: docs/superpowers/specs/2026-10-21-controller-footprint-ab-report.md
footprint_aware_control: false
footprint_sample_spacing: 0.05
path_resample_step: 0.08
inflation_radius: 0.62

# 里程计话题
odom_topic: /odom
# RViz "2D Nav Goal" 默认话题; 订阅后按 goal 的箭头方向对齐末端航向
rviz_goal_topic: "/move_base_simple/goal"
rviz_goal_align_yaw: true

# 安全层 (Nav2 Collision Monitor 等价)
safety_enabled: true
safety_self_filter_radius: 0.10
# 与 3D 前端相同的车体自过滤 (base_footprint 系包围盒):
scan_self_filter_enabled: true
scan_self_x_min: -0.45
scan_self_x_max: 0.75
scan_self_y_min: -0.55
scan_self_y_max: 0.55
safety_fail_safe_on_timeout: true
safety_source_timeout: 0.5
# 实车 footprint 外扩 stop_dist=0.12 / g_robot_safe_dist=0.30
# ---- 安全区 (nav2_collision_monitor 机制) ----
# 车身内的点由 body_polygon 排除 (footprint 包围盒 + safety_body_margin),
# 所以下面三个 STOP 区都从车体边缘之外开始. 以前用 "包围盒内不判定 + 大矩形自过滤"
# 的组合, 结果 safety_stop_polygon 整个落在自过滤框里, STOP 永远进不去.
safety_body_margin: 0.05
# 前进: 车头前 0 ~ 0.4m
safety_stop_polygon: [0.55, -0.40, 0.95, -0.40, 0.95, 0.40, 0.55, 0.40]
# 后退: 车尾后 0.35 ~ 0.75m
safety_stop_polygon_backward: [-0.75, -0.40, -0.35, -0.40, -0.35, 0.40, -0.75, 0.40]
# 原地旋转: 车体扫掠面 + 0.2m
# 原地转用扫掠圆 (半径 = 车体最远顶点 0.64 + 余量); 0 = 用上面的矩形
safety_rotation_radius_margin: 0.10
safety_stop_polygon_rotation: [-0.50, -0.55, 0.80, -0.55, 0.80, 0.55, -0.50, 0.55]
# 减速: 车头前 0 ~ 0.6m
safety_slowdown_polygon: [0.55, -0.55, 1.15, -0.55, 1.15, 0.55, 0.55, 0.55]
# 滞回 (20Hz 下 2/3 帧 = 100/150ms)
safety_stop_trigger_frames: 2
# 点数阈值: 0.8m 处 10cm 障碍约 20 个点, 稀疏伪回波只有 3~4 个
safety_stop_max_points: 4
safety_slowdown_max_points: 6
safety_stop_release_frames: 3
safety_slowdown_trigger_frames: 1
safety_slowdown_release_frames: 2

# ---- 指令整形 / 死手 / 遥控仲裁 (nav2 velocity_smoother + twist_mux) ----
velocity_timeout: 0.6          # 无指令超时后平滑回零 (0=关闭)
deadband_velocity_v: 0.0
deadband_velocity_w: 0.0
teleop_topic: ""               # 例如 /cmd_vel_teleop; 空=关闭
teleop_timeout: 0.5
strict_config: false           # true: 配置自检失败直接退出
safety_slowdown_polygon: [-0.55, -0.63, 0.85, -0.63, 0.85, 0.63, -0.55, 0.63]
safety_slowdown_ratio: 0.5
safety_approach_enabled: true
safety_time_before_collision: 2.0
# 实车 footprint
safety_footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]

# 动态障碍跟踪
tracking_enabled: true
tracking_horizon: 0.5
tracking_cluster_distance: 0.35
tracking_confirm_hits: 3
tracking_max_radius: 1.2
tracking_min_prediction_speed: 0.15

# 统一恢复: 后退 -> 原地转向 -> 重试原任务
recovery_enabled: true
recovery_max_attempts: 2
recovery_back_distance: 0.60
recovery_timeout: 20.0

# 3D 体素 / STVL 层
voxel_enabled: true
voxel_cloud_topic: "/world_cloud"
voxel_resolution: 0.10
voxel_max_points: 200000
voxel_min_height: 0.15
voxel_max_height: 1.60
voxel_decay: 2.0
voxel_inflation: 0.05

# ---- 动态覆盖清洁 (navi_cmd=20) ----
coverage_controller_name: "pure_pursuit"  # 覆盖模式单独控制器
coverage_sweep_width: 0.5          # 清扫宽度 m
coverage_max_speed: 0.4            # robot_vel<=0 时的覆盖速度 m/s
coverage_resolution: 0.05          # 与地图分辨率一致最好
coverage_replan_period: 10.0       # 周期兜底；正常按“路径走完/2s 不动”重规划
coverage_horizon: 2.5              # 每段执行长度 m
coverage_retry_timeout: 10.0       # 被动态障碍挡住多久后标不可达
coverage_complete_rate: 0.99      # 覆盖率达到多少就收尾, 剩余标不可达
coverage_blocked_inflation: 0.10   # 动态障碍点膨胀 m
coverage_plan_inflation: 0.0       # 覆盖 A* 不再膨胀：区域边界=硬边界, 车体形状交给 footprint
coverage_plan_robot_radius: 0.0
coverage_report_path: ""           # 非空则结束写 coverage_report.json

# ---- 接口/话题全部参数化 ----
map_topic: "/map"
scan_topic: "/scan"
goal_topic: "/goal_pose"
nav_stop_service: "/nav_stop"
global_path_topic: "/global_path"
local_path_topic: "/local_path"
global_costmap_topic: "/global_costmap"
local_costmap_topic: "/local_costmap"
goal_status_topic: "/goal_status"
diagnostics_topic: "/nav_diagnostics"
tracked_obstacles_topic: "/tracked_obstacles"

# ---- 传感器 fail-safe ----
map_timeout: 0.0
scan_timeout: 0.5
cloud_timeout: 1.0
require_scan: true
require_cloud: false

# ---- 重规划滞回 / costmap 节流 ----
replan_max_interval: 5.0
replan_min_interval: 1.0
replan_on_blocked: true
costmap_update_rate: 5.0

# ---- 激光孤立点滤波 ----
laser_filter_enabled: true
laser_filter_radius: 0.15
laser_filter_min_neighbors: 1
laser_filter_window: 2

# ---- 恢复规划: 忽略当前 footprint 压住的障碍 ----
recovery_clear_start_footprint: true
recovery_start_clear_margin: 0.05
recovery_start_relax_radius: 1.0

# ---- 正常规划: 起点 footprint 去噪, 不做整段放宽 ----
planning_clear_start_footprint: true
planning_start_clear_margin: 0.05
planning_start_relax_radius: 0.0
