# ============================================================
# rosiwit_navigation_ros1 默认参数 (与 ROS2 config/params.yaml 对应)
# ============================================================
# 速度限制
max_velocity_x: 0.5
min_velocity_x: 0.0
max_velocity_theta: 1.0

max_accel_x: 0.4
max_accel_theta: 0.8

planner_max_iterations: 200000
planner_timeout: 2.0

# 频率
controller_frequency: 20.0
planner_frequency: 1.0

# 规划器 / 控制器
planner_name: "astar"
controller_name: "dwa"

# 坐标系
global_frame: "map"
robot_frame: "base_link"
map_frame: "map"

# 导航容差
goal_tolerance_xy: 0.1
goal_tolerance_yaw: 0.1

# Pure Pursuit 前瞻距离
lookahead_distance: 0.8
min_lookahead_distance: 0.4
max_lookahead_distance: 1.2

# 机器人 / 膨胀半径 (m)
robot_radius: 0.30
inflation_radius: 1.0

# 里程计话题
odom_topic: /odom

# 安全层 (Nav2 Collision Monitor 等价)
safety_enabled: true
safety_self_filter_radius: 0.25
safety_fail_safe_on_timeout: true
safety_source_timeout: 0.5
safety_stop_polygon: [-0.55, -0.40, 0.55, -0.40, 0.55, 0.40, -0.55, 0.40]
safety_slowdown_polygon: [-0.75, -0.55, 0.85, -0.55, 0.85, 0.55, -0.75, 0.55]
safety_slowdown_ratio: 0.5
safety_approach_enabled: true
safety_time_before_collision: 2.0
safety_footprint: [-0.25, -0.22, 0.25, -0.22, 0.25, 0.22, -0.25, 0.22]
