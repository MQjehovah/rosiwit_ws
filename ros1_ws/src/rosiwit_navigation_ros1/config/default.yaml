# ============================================================
# rosiwit_navigation_ros1 默认参数
#
# ⚠ 车体/安全参数取自实车 192.168.21.166 的 /robot_move_base/*，
#   不是仿真值。robot_movebase 兼容接口请用 config/movebase_compat.yaml。
# 速度/加速度/容差/前瞻/安全距离的实车依据见
# docs/superpowers/specs/2026-10-21-ros1-movebase-interface-compat-design.md §9。
# ============================================================
# 速度限制 (实车 max_speed=0.8, speed_lim_w=0.5)
max_velocity_x: 0.8
min_velocity_x: 0.0
max_velocity_theta: 0.5

max_accel_x: 0.3
max_accel_theta: 0.2

planner_max_iterations: 200000
planner_timeout: 2.0

# 频率 (实车 g_control_freq=10)
controller_frequency: 10.0
planner_frequency: 1.0

# 规划器 / 控制器
planner_name: "astar"
controller_name: "dwa"

# 坐标系 (实车 robot_base_frame=base_footprint)
global_frame: "map"
robot_frame: "base_footprint"
map_frame: "map"

# 导航容差 (实车 xy/yaw_goal_tolerance=0.1)
goal_tolerance_xy: 0.1
goal_tolerance_yaw: 0.1

# 前瞻距离 (实车 min/max_lookahead_dist=0.3/0.9)
lookahead_distance: 0.6
min_lookahead_distance: 0.3
max_lookahead_distance: 0.9

# 规划安全距离 (m)
# robot_radius = 实车 g_min_safe (硬禁区); inflation_radius = g_max_safe 的等效膨胀.
# 实车 footprint x[-0.25,0.55] y[-0.33,0.33] 由 safety_footprint 表达.
robot_radius: 0.39
# 长方形车体: 控制器按 footprint 采样点查 raw costmap, 而不是只看中心点.
# 默认关闭: A/B 实测 DWA+footprint 会绕圈, 建议按下面组合验证后再打开:
#   controller_name: mppi
#   footprint_aware_control: true
#   max_accel_theta: 0.3
# 报告: docs/superpowers/specs/2026-10-21-controller-footprint-ab-report.md
footprint_aware_control: false
footprint_sample_spacing: 0.05
inflation_radius: 0.62

# 里程计话题
odom_topic: /odom
# RViz "2D Nav Goal" 默认话题; 订阅后按 goal 的箭头方向对齐末端航向
rviz_goal_topic: "/move_base_simple/goal"
rviz_goal_align_yaw: true

# 安全层 (Nav2 Collision Monitor 等价)
safety_enabled: true
safety_self_filter_radius: 0.25
safety_fail_safe_on_timeout: true
safety_source_timeout: 0.5
# 实车 footprint 外扩 stop_dist=0.12 / g_robot_safe_dist=0.30
safety_stop_polygon: [-0.37, -0.45, 0.67, -0.45, 0.67, 0.45, -0.37, 0.45]
safety_slowdown_polygon: [-0.55, -0.63, 0.85, -0.63, 0.85, 0.63, -0.55, 0.63]
safety_slowdown_ratio: 0.5
safety_approach_enabled: true
safety_time_before_collision: 2.0
# 实车 footprint
safety_footprint: [-0.25, -0.33, 0.45, -0.33, 0.55, -0.20, 0.55, 0.20, 0.45, 0.33, -0.25, 0.33]

# 动态障碍跟踪
tracking_enabled: true
tracking_horizon: 0.5
tracking_cluster_distance: 0.35
tracking_confirm_hits: 3

# 3D 体素 / STVL 层
voxel_enabled: true
voxel_cloud_topic: "/world_cloud"
voxel_resolution: 0.10
voxel_min_height: -0.20
voxel_max_height: 2.00
voxel_decay: 2.0
voxel_inflation: 0.15

# ---- 动态覆盖清洁 (navi_cmd=20) ----
coverage_controller_name: "pure_pursuit"  # 覆盖模式单独控制器
coverage_sweep_width: 0.5          # 清扫宽度 m
coverage_max_speed: 0.4            # robot_vel<=0 时的覆盖速度 m/s
coverage_resolution: 0.05          # 与地图分辨率一致最好
coverage_replan_period: 10.0       # 周期兜底；正常按“路径走完/2s 不动”重规划
coverage_horizon: 2.5              # 每段执行长度 m
coverage_retry_timeout: 10.0       # 被动态障碍挡住多久后标不可达
coverage_complete_rate: 0.995      # 覆盖率达到多少就收尾, 剩余标不可达
coverage_blocked_inflation: 0.10   # 动态障碍点膨胀 m
coverage_plan_inflation: 0.0       # 覆盖 A* 不再膨胀：区域边界=硬边界, 车体形状交给 footprint
coverage_plan_robot_radius: 0.0
coverage_report_path: ""           # 非空则结束写 coverage_report.json
